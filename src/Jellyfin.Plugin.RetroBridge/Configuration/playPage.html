<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RetroBridge</title>
<style>
  :root { --bg: #f4f4f6; --panel: #ffffff; --text: #1b1b1f; --muted: #5d5d66; --accent: #00a4dc; --accent-text: #ffffff; --border: #d9d9df; }
  @media (prefers-color-scheme: dark) { :root { --bg: #101014; --panel: #1c1c22; --text: #ececf1; --muted: #a0a0ab; --border: #2e2e36; } }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .muted { color: var(--muted); margin: 0 0 20px; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  .bar label { flex: 1 1 220px; display: flex; flex-direction: column; gap: 4px; font-size: .875rem; color: var(--muted); }
  input, select, button { font: inherit; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  li { display: flex; flex-direction: column; gap: 8px; padding: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
  li.empty { grid-column: 1 / -1; }
  .cover { aspect-ratio: 3 / 4; border-radius: 6px; background: var(--bg); display: flex; align-items: center; justify-content: center; overflow: hidden; color: var(--muted); font-weight: 600; letter-spacing: .05em; }
  .cover img { width: 100%; height: 100%; object-fit: contain; }
  li span { font-weight: 600; overflow-wrap: anywhere; line-height: 1.3; }
  li small { display: block; color: var(--muted); font-weight: 400; margin-top: 2px; }
  button.play { background: var(--accent); color: var(--accent-text); border: 0; padding: 8px 18px; cursor: pointer; margin-top: auto; }
  button:disabled { opacity: .5; cursor: default; }
  #status { min-height: 1.5em; }
  .notice { margin-bottom: 16px; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); }
  code { overflow-wrap: anywhere; }
</style>
</head><body><main>
  <h1>RetroBridge</h1>
  <p class="muted">Play NES, Game Boy, and Game Boy Color games in RetroArch on a paired computer.</p>
  <div id="setup" class="notice" hidden></div>
  <div id="library" hidden>
    <div class="bar">
      <label>Play on<select id="device"></select></label>
      <label>Search<input id="search" type="search" autocomplete="off"></label>
      <label>Platform<select id="platform"><option value="">All</option><option value="nes">NES</option><option value="gb">Game Boy</option><option value="gbc">Game Boy Color</option></select></label>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <ul id="games"></ul>
  </div>
<script>
(function () {
  var auth = null, games = [], devices = [];
  // iOS cannot run a companion, so it can only send launches to a listening device. Android has its own companion app.
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var android = /Android/.test(navigator.userAgent);
  var mobile = ios || android;
  var $ = function (id) { return document.getElementById(id); };

  // Reuse the Jellyfin web client's session from this origin; this page stores nothing.
  function session() {
    try {
      var servers = JSON.parse(localStorage.getItem('jellyfin_credentials') || '{}').Servers || [];
      var current = servers.filter(function (s) { return s.AccessToken && s.UserId; })
        .sort(function (a, b) { return (b.DateLastAccessed || 0) - (a.DateLastAccessed || 0); })[0];
      return current ? current.AccessToken : null;
    } catch (_) { return null; }
  }
  function header() {
    return 'MediaBrowser Client="RetroBridge Web", Device="Browser", DeviceId="retrobridge-web", Version="0.1.0", Token="' + auth + '"';
  }
  async function api(method, path, body) {
    var response = await fetch(path, { method: method, headers: Object.assign({ Authorization: header() }, body ? { 'Content-Type': 'application/json' } : {}), body: body ? JSON.stringify(body) : undefined });
    if (!response.ok) { var error = new Error('HTTP ' + response.status); error.status = response.status; throw error; }
    return response.status === 204 ? null : response.json();
  }
  function setup(lines) {
    var box = $('setup'); box.replaceChildren();
    lines.forEach(function (line) { var p = document.createElement('p'); if (Array.isArray(line)) { p.append(line[0]); var c = document.createElement('code'); c.textContent = line[1]; p.append(c); } else p.textContent = line; box.append(p); });
    box.hidden = false;
  }
  // Images need the Jellyfin session header, so fetch them and show local blob URLs (cached per game).
  var arts = {};
  function art(game) {
    if (!arts[game.Id]) arts[game.Id] = fetch('Games/' + encodeURIComponent(game.Id) + '/Art', { headers: { Authorization: header() } })
      .then(function (r) { return r.ok ? r.blob() : null; }).then(function (b) { return b && b.type === 'image/png' ? URL.createObjectURL(b) : null; })
      .catch(function () { return null; });
    return arts[game.Id];
  }
  function render() {
    var search = $('search').value.toLowerCase(), platform = $('platform').value, list = $('games');
    list.replaceChildren();
    games.filter(function (g) { return g.Title.toLowerCase().includes(search) && (!platform || g.Platform === platform); }).forEach(function (g) {
      var li = document.createElement('li'), cover = document.createElement('div'), name = document.createElement('span'), tag = document.createElement('small'), play = document.createElement('button');
      cover.className = 'cover'; cover.textContent = g.Platform.toUpperCase();
      if (g.HasArt) art(g).then(function (url) { if (!url) return; var img = document.createElement('img'); img.src = url; img.alt = ''; cover.replaceChildren(img); });
      name.textContent = g.Title; tag.textContent = g.Platform.toUpperCase() + (g.Region ? ' · ' + g.Region : ''); name.append(tag);
      play.className = 'play'; play.textContent = 'Play'; play.setAttribute('aria-label', 'Play ' + g.Title);
      play.disabled = !devices.length; if (!devices.length) play.title = 'Pair a device to play';
      play.addEventListener('click', function () { launch(g, play); });
      li.append(cover, name, play); list.append(li);
    });
    if (!list.children.length) { var empty = document.createElement('li'); empty.className = 'empty'; empty.textContent = games.length ? 'No games match.' : 'No games yet. Ask an administrator to scan the library.'; list.append(empty); }
  }
  function selected() { return devices.filter(function (d) { return d.Id === $('device').value; })[0]; }
  async function launch(game, button) {
    var device = selected();
    if (ios && !device.Listening) {
      $('status').textContent = device.Name + ' is not listening. On that computer, run: RetroBridge.Launcher listen — then try again.';
      return;
    }
    button.disabled = true; $('status').textContent = 'Preparing ' + game.Title + '…';
    try {
      var result = await api('POST', 'Games/' + encodeURIComponent(game.Id) + '/LaunchTicket', { DeviceId: device.Id });
      if (result.Delivered) { $('status').textContent = 'Sent to ' + device.Name + '. ' + game.Title + ' will start there in a few seconds.'; return; }
      $('status').textContent = android ? 'Opening RetroBridge for Android. If nothing happens, install and pair the RetroBridge app, or listen on ' + device.Name + '.'
        : 'Opening RetroBridge on this computer. If nothing happens, run the companion\'s register command, or listen on ' + device.Name + '.';
      window.location.href = 'retrobridge://launch?ticket=' + encodeURIComponent(result.Ticket);
    } catch (error) {
      $('status').textContent = error.status === 403 ? 'Your access to RetroBridge was removed.' : 'Could not start the game. Try again.';
    } finally { setTimeout(function () { button.disabled = false; }, 3000); }
  }
  async function start() {
    auth = session();
    if (!auth) { setup(['Sign in to Jellyfin in this browser first, then reload this page.']); return; }
    try {
      devices = await api('GET', 'Devices');
      // Browsing works without a device; only Play needs one.
      if (!devices.length) {
        $('device').closest('label').hidden = true;
        setup([android ? 'Pair a device first. Install the RetroBridge Android app and pair this phone, or on a computer install the companion and run:' : ios ? 'Pair a computer first. On the computer you want to play on, install the RetroBridge companion and run:' : 'Pair this computer first. Install the RetroBridge companion and run:', ['', 'RetroBridge.Launcher pair ' + location.origin + location.pathname.replace(/RetroBridge\/Play$/, '')],
          'Then enter the code shown under your Jellyfin profile → Quick Connect, and reload this page.']);
      }
      // Listening devices first: they work from any browser.
      devices.sort(function (a, b) { return b.Listening - a.Listening; }).forEach(function (d) {
        var o = document.createElement('option'); o.value = d.Id; o.textContent = d.Name + (d.Listening ? ' (ready)' : ''); $('device').append(o);
      });
      games = await api('GET', 'Games');
      $('library').hidden = false; render();
    } catch (error) {
      setup([error.status === 403 ? 'Your account does not have access to RetroBridge. Ask an administrator.' : error.status === 401 ? 'Your Jellyfin session expired. Sign in again, then reload.' : 'RetroBridge is unavailable right now.']);
    }
  }
  $('search').addEventListener('input', render);
  $('platform').addEventListener('change', render);
  start();
}());
</script>
</main></body></html>
