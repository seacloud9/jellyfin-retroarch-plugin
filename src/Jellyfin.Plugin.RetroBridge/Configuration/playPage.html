<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RetroBridge</title>
<style>
  :root { color-scheme: dark; --bg: #10161e; --panel: #1b2430; --text: #f3f7fa; --muted: #b0bdca; --accent: #8de7d0; --border: #36414d; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 Inter, system-ui, sans-serif; }
  main { max-width: 1160px; margin: auto; padding: 0 clamp(16px,4vw,48px) 28px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; border-bottom: 1px solid var(--border); }
  .brand { display: inline-flex; align-items: center; gap: .65em; font-weight: 750; letter-spacing: -.035em; }
  .brand::before { content: ""; width: 1em; height: 1em; background: var(--accent); clip-path: polygon(33% 0,67% 0,67% 33%,100% 33%,100% 67%,67% 67%,67% 100%,33% 100%,33% 67%,0 67%,0 33%,33% 33%); }
  a { color: var(--accent); }
  header a, footer { font-size: .85rem; color: var(--muted); }
  h1 { margin: 26px 0 0; font-size: clamp(2rem,5vw,3.4rem); line-height: 1.15; letter-spacing: -.055em; }
  h2 { margin: 0; font-size: 1.2rem; letter-spacing: -.025em; }
  .muted, .notice { color: var(--muted); }
  .intro { margin: 8px 0 24px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-bottom: 20px; }
  .bar label { font-size: .83rem; color: var(--muted); }
  .bar label > * { display: block; margin-top: 4px; }
  input, select, button { font: inherit; padding: 8px 12px; border-radius: 7px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
  button, summary { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .bar input { width: min(230px,100%); }
  .shelf { margin-bottom: 24px; }
  .shelf h2 { margin-bottom: 12px; }
  .count { color: var(--muted); font-size: .82rem; font-weight: 500; margin-left: .6em; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill,minmax(min(100%,204px),1fr)); }
  li { min-width: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; }
  .cover { aspect-ratio: 16 / 9; background: #141b26; display: grid; place-items: center; overflow: hidden; color: var(--muted); font-weight: 600; }
  .cover img { width: 100%; height: 100%; object-fit: contain; }
  .card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .card-title { font-size: 1.06rem; font-weight: 700; overflow-wrap: anywhere; }
  li small { color: var(--muted); }
  .card-actions { margin-top: auto; padding-top: 9px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  button.play { background: var(--accent); color: #0d2922; border: 0; padding: 6px 15px; font-size: .9rem; font-weight: 700; }
  button.play::before { content: ""; display: inline-block; margin-right: 7px; width: .6em; height: .7em; background: currentColor; clip-path: polygon(0 0,100% 50%,0 100%); }
  button.play:hover { background: #b1f9e5; }
  button.remote { font-size: .83rem; }
  button:disabled { opacity: .55; cursor: default; }
  #status:empty { margin: 0; }
  footer { border-top: 1px solid var(--border); padding-top: 14px; }
  footer summary { width: fit-content; }
  @media (max-width: 520px) {
    ul { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 9px; }
    .card-body { padding: 10px; }
    .bar { align-items: stretch; } .bar label { flex: 1 1 120px; } .bar label > * { width: 100%; }
  }
  #player { position: fixed; inset: 0; background: #000; color: #eee; z-index: 10; touch-action: none; user-select: none; -webkit-user-select: none;
    display: grid; gap: 12px; padding: max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
    overflow-y: auto;
    grid-template: "heading heading" auto "screen screen" auto "status status" auto "dpad actions" auto "system system" auto / 1fr 1fr; align-content: start; justify-items: center; }
  .player-heading { grid-area: heading; width: min(100%,920px); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  #screen { grid-area: screen; width: min(100%,920px,95vh); aspect-ratio: 16 / 9; align-self: center; min-height: 0; }
  #screen canvas { display: block; width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; background: #000; outline: none; border: 0; }
  #player-status { grid-area: status; min-height: 1.4em; margin: 0; font-size: .9rem; color: #aaa; text-align: center; }
  .dpad { grid-area: dpad; justify-self: end; margin-right: clamp(0px,4vw,40px); }
  .actions { grid-area: actions; justify-self: start; margin-left: clamp(0px,4vw,40px); align-self: center; }
  .system { grid-area: system; }
  .controls-end { display: flex; gap: 12px; }
  /* Phones held sideways: controls either side of the screen. */
  @media (orientation: landscape) and (max-height: 520px) {
    #player { grid-template: "heading heading heading" auto "dpad screen actions" 1fr "status status status" auto "system system system" auto / auto 1fr auto; align-content: stretch; align-items: center; }
    #screen { width: min(100%,100vh); }
  }
  .dpad { display: grid; grid-template: repeat(3, clamp(36px,10vw,46px)) / repeat(3, clamp(36px,10vw,46px)); }
  .pad button, .system button { background: #2a2a31; color: #eee; border: 0; border-radius: 10px; font-weight: 700; touch-action: none; }
  .pad button:active, .pad button.down, .system button.down { background: #45454f; }
  .actions { display: grid; grid-template-columns: repeat(var(--columns, 2), clamp(34px,10vw,50px)); gap: 6px; }
  .actions .shoulder { height: 40px; border-radius: 10px; font-size: .8rem; }
  .actions .round { width: clamp(34px,10vw,50px); height: clamp(34px,10vw,50px); border-radius: 50%; }
  .system { display: flex; gap: 12px; }
  .system button { padding: 8px 14px; font-size: .8rem; }
  details.diagnostics { margin-bottom: 8px; font-size: .85rem; color: var(--muted); }
  details.diagnostics pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: var(--text); }
  #exit, #fullscreen { background: transparent; border: 1px solid #555; color: #eee; padding: 8px 18px; border-radius: 6px; }
</style>
</head><body><main>
  <div id="browse">
  <header><span class="brand">RetroBridge</span><a href="../web/">Jellyfin home</a></header>
  <h1>Game library</h1>
  <p class="muted intro">Choose an included game to play in this browser.</p>
  <div id="setup" class="notice" role="status" hidden></div>
  <div id="library" hidden>
    <div class="bar">
      <label>Search games<input id="search" type="search" autocomplete="off" placeholder="Game title"></label>
      <label>Platform<select id="platform"><option value="">All platforms</option></select></label>
      <label hidden>Paired device<select id="device"></select></label>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <div id="games">
      <section class="shelf"><h2>Included games<span id="included-count" class="count"></span></h2><ul id="included"></ul></section>
      <section class="shelf"><h2>Added games<span id="added-count" class="count"></span></h2><ul id="added"></ul></section>
    </div>
    <p class="muted" id="empty" hidden></p>
  </div>
<footer><details class="diagnostics" id="diagnostics">
  <summary>Diagnostics</summary>
  <p>Share this report if something does not work. It contains no passwords or tokens.</p>
  <button id="copy-report" type="button">Copy report</button>
  <pre id="report"></pre>
</details>
<a id="third-party" href="https://github.com/seacloud9/jellyfin-retroarch-plugin/blob/main/docs/third-party.md" hidden>Emulator licenses and source</a>
</footer>
</div>
<div id="player" role="dialog" aria-modal="true" aria-labelledby="playing-title" hidden>
  <div class="player-heading"><h2 id="playing-title"></h2>
    <div class="controls-end"><button id="fullscreen" type="button" hidden>Fullscreen</button><button id="exit" type="button">Back to library</button></div>
  </div>
  <div id="screen"></div>
  <p id="player-status" role="status" aria-live="polite"></p>
  <div class="dpad pad">
    <span></span><button data-button="up" aria-label="Up">▲</button><span></span>
    <button data-button="left" aria-label="Left">◀</button><span></span><button data-button="right" aria-label="Right">▶</button>
    <span></span><button data-button="down" aria-label="Down">▼</button><span></span>
  </div>
  <div class="actions pad" id="actions"></div>
  <div class="system"><button data-button="select">SELECT</button><button data-button="start">START</button></div>
</div>
<script>
(function () {
  var auth = null, games = [], devices = [], saved = {}, web = { Enabled: true, Platforms: ['nova64'], Cores: { nova64: 'nova64' }, MaxBytes: Infinity };
  // Same list as RetroBridge.Domain.Platforms.
  var PLATFORMS = { nes: 'NES', snes: 'SNES', n64: 'Nintendo 64', gb: 'Game Boy', gbc: 'Game Boy Color', gba: 'Game Boy Advance', genesis: 'Genesis / Mega Drive', psx: 'PlayStation', nova64: 'Nova64' };
  // Touch buttons per system: [RetroArch button, label]. Shoulder buttons go on the top row.
  var FACE = { nova64: [['b', 'Z'], ['a', 'X']], snes: [['y', 'Y'], ['x', 'X'], ['b', 'B'], ['a', 'A']], genesis: [['y', 'A'], ['b', 'B'], ['a', 'C']],
    psx: [['y', '□'], ['x', '△'], ['b', '✕'], ['a', '○']] };
  var SHOULDERS = { snes: true, gba: true, psx: true };
  // Diagnostics: recent errors and outcomes for the support report (no tokens are ever recorded).
  var diag = { version: null, errors: [], lastLaunch: null, browser: null };
  function note(kind, message) {
    diag.errors.push(new Date().toISOString().slice(11, 19) + ' ' + kind + ': ' + String(message).slice(0, 300));
    if (diag.errors.length > 20) diag.errors.shift();
  }
  window.addEventListener('error', function (e) { note('error', e.message); });
  window.addEventListener('unhandledrejection', function (e) { note('rejection', e.reason && e.reason.message || e.reason); });
  // iOS cannot run a companion, so it can only send launches to a listening device. Android has its own companion app.
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var android = /Android/.test(navigator.userAgent);

  var $ = function (id) { return document.getElementById(id); };


  // Reuse the Jellyfin web client's session from this origin; this page stores nothing.
  function session() {
    try {
      var servers = JSON.parse(localStorage.getItem('jellyfin_credentials') || '{}').Servers || [];
      var current = servers.filter(function (s) { return s.AccessToken && s.UserId; })
        .sort(function (a, b) { return (b.DateLastAccessed || 0) - (a.DateLastAccessed || 0); })[0];
      return current ? current.AccessToken : null;
    } catch (_) { return null; }
  }
  function header() {
    return 'MediaBrowser Client="RetroBridge Web", Device="Browser", DeviceId="retrobridge-web", Version="0.2.1", Token="' + auth + '"';
  }
  async function api(method, path, body) {
    var response = await fetch(path, { method: method, headers: Object.assign({ Authorization: header() }, body ? { 'Content-Type': 'application/json' } : {}), body: body ? JSON.stringify(body) : undefined });
    if (!response.ok) { var error = new Error('HTTP ' + response.status); error.status = response.status; throw error; }
    return response.status === 204 ? null : response.json();
  }
  function setup(lines) {
    var box = $('setup'); box.replaceChildren();
    lines.forEach(function (line) { var p = document.createElement('p'); if (Array.isArray(line)) { p.append(line[0]); var c = document.createElement('code'); c.textContent = line[1]; p.append(c); } else p.textContent = line; box.append(p); });
    box.hidden = false;
  }
  // Images need the Jellyfin session header, so fetch them and show local blob URLs (cached per game).
  var arts = {};
  function art(game) {
    if (!arts[game.Id]) arts[game.Id] = fetch('Games/' + encodeURIComponent(game.Id) + '/Art', { headers: { Authorization: header() } })
      .then(function (r) { return r.ok ? r.blob() : null; }).then(function (b) { return b && (b.type === 'image/png' || b.type === 'image/jpeg') ? URL.createObjectURL(b) : null; })
      .catch(function () { return null; });
    return arts[game.Id];
  }
  function ago(when) {
    var minutes = Math.round((Date.now() - new Date(when).getTime()) / 60000);
    if (minutes < 1) return 'just now';
    if (minutes < 60) return minutes + ' min ago';
    if (minutes < 1440) return Math.round(minutes / 60) + ' h ago';
    return new Date(when).toLocaleDateString();
  }
  function render() {
    var search = $('search').value.trim().toLowerCase(), platform = $('platform').value;
    $('included').replaceChildren(); $('added').replaceChildren();
    games.filter(function (g) { return g.Title.toLowerCase().includes(search) && (!platform || g.Platform === platform); }).forEach(function (g) {
      var li = document.createElement('li'), cover = document.createElement('div'), body = document.createElement('div');
      var name = document.createElement('span'), tag = document.createElement('small'), actions = document.createElement('div');
      cover.className = 'cover'; cover.textContent = PLATFORMS[g.Platform] || g.Platform;
      if (g.HasArt) art(g).then(function (url) { if (url) { var img = new Image(); img.src = url; img.alt = ''; cover.replaceChildren(img); } });
      body.className = 'card-body'; name.className = 'card-title'; name.textContent = g.Title;
      tag.textContent = (PLATFORMS[g.Platform] || g.Platform) + (g.Region ? ' · ' + g.Region : '');
      body.append(name, tag);
      if (saved[g.Id]) { var save = document.createElement('small'); save.textContent = 'Saved ' + ago(saved[g.Id].Modified) + ' on ' + saved[g.Id].Device; body.append(save); }
      actions.className = 'card-actions';
      if (inBrowser(g)) {
        var play = document.createElement('button');
        play.className = 'play'; play.textContent = 'Play'; play.setAttribute('aria-label', 'Play ' + g.Title + ' in this browser');
        play.addEventListener('click', function () { playInBrowser(g); }); actions.append(play);
      }
      if (devices.length) {
        var remote = document.createElement('button');
        remote.className = inBrowser(g) ? 'remote' : 'play'; remote.textContent = 'Play on ' + selected().Name;
        remote.setAttribute('aria-label', 'Play ' + g.Title + ' on ' + selected().Name);
        remote.addEventListener('click', function () { launch(g, remote); }); actions.append(remote);
      }
      if (!actions.children.length) { var hint = document.createElement('small'); hint.textContent = 'Pair a RetroBridge companion to play this game.'; actions.append(hint); }
      body.append(actions); li.append(cover, body); $(g.IsBundled ? 'included' : 'added').append(li);
    });
    ['included', 'added'].forEach(function (id) {
      var count = $(id).children.length;
      $(id).parentElement.hidden = !count; $(id + '-count').textContent = String(count);
    });
    $('empty').hidden = !!($('included').children.length || $('added').children.length);
    $('empty').textContent = games.length ? 'No games match these filters.' : 'No games are available for this account.';
  }
  // Very large discs are left to native play: the whole game is held in the page's memory.
  function inBrowser(g) { return web.Enabled && web.Platforms.includes(g.Platform) && !(g.Size > (web.MaxBytes || Infinity)); }
  function selected() { return devices.filter(function (d) { return d.Id === $('device').value; })[0]; }
  async function launch(game, button) {
    var device = selected();
    if (ios && !device.Listening) {
      $('status').textContent = device.Name + ' is not listening. On that computer, run: RetroBridge.Launcher listen — then try again.';
      return;
    }
    button.disabled = true; $('status').textContent = 'Preparing ' + game.Title + '…';
    try {
      var result = await api('POST', 'Games/' + encodeURIComponent(game.Id) + '/LaunchTicket', { DeviceId: device.Id });
      diag.lastLaunch = game.Title + ' → ' + device.Name + (result.Delivered ? ' (sent to listener)' : ' (opened retrobridge:// link)');
      if (result.Delivered) { $('status').textContent = 'Sent to ' + device.Name + '. ' + game.Title + ' will start there in a few seconds.'; return; }
      $('status').textContent = android ? 'Opening RetroBridge for Android. If nothing happens, install and pair the RetroBridge app, or listen on ' + device.Name + '.'
        : 'Opening RetroBridge on this computer. If nothing happens, run the companion\'s register command, or listen on ' + device.Name + '.';
      window.location.href = 'retrobridge://launch?ticket=' + encodeURIComponent(result.Ticket);
    } catch (error) {
      note('launch', game.Title + ': HTTP ' + (error.status || error.message));
      diag.lastLaunch = game.Title + ' failed (' + (error.status || error.message) + ')';
      $('status').textContent = error.status === 403 ? 'Your access to RetroBridge was removed.' : 'Could not start the game. Try again.';
    } finally { setTimeout(function () { button.disabled = false; }, 3000); }
  }
  // ---- In-browser play (experimental): emulator files come from this server; saves use the save sync API. ----
  // Named 'playing' so it does not shadow session(), which reads the Jellyfin login.
  var emulator = null, playing = null, launchRequest = null, opener = null;
  function raw(method, path, body, keepalive) {
    return fetch(path, { method: method, headers: { Authorization: header() }, body: body, keepalive: !!keepalive });
  }
  function loadNostalgist() {
    if (window.Nostalgist) return Promise.resolve();
    return new Promise(function (resolve, reject) {
      var script = document.createElement('script');
      script.src = 'Web/nostalgist.umd.js'; script.onload = resolve; script.onerror = function () { reject(new Error('emulator unavailable')); };
      document.head.append(script);
    });
  }
  function same(a, b) { if (!a || !b || a.length !== b.length) return false; for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false; return true; }
  function playerStatus(text) { $('player-status').textContent = text; }
  // Saves run one at a time; a request during a save waits for it and then saves the latest state.
  function flush(keepalive) {
    if (!emulator || !playing) return Promise.resolve();
    var current = playing;
    current.pending = (current.pending || Promise.resolve()).then(function () { return saveNow(current, keepalive); });
    return current.pending;
  }
  async function saveNow(playing, keepalive) {
    if (!emulator) return;
    try {
      var bytes = await readSave(playing.game);
      if (!bytes.length || same(bytes, playing.last)) return;
      var route = 'Games/' + encodeURIComponent(playing.game.Id) + '/Saves/' + encodeURIComponent(playing.name);
      var response = await raw('PUT', route + '?baseRevision=' + playing.revision, bytes, keepalive);
      if (response.status === 409) {
        // Another device saved meanwhile: the copy just played wins; the server keeps the previous versions.
        var current = await response.json();
        response = await raw('PUT', route + '?baseRevision=' + current.Revision, bytes, keepalive);
      }
      if (!response.ok) throw new Error('HTTP ' + response.status);
      playing.revision = (await response.json()).Revision; playing.last = bytes;
      diag.browser = playing.game.Title + ' on ' + web.Cores[playing.game.Platform] + ' · saved revision ' + playing.revision + ' at ' + new Date().toISOString().slice(11, 19);
      window.__browserPlay = { booted: true, revision: playing.revision };
      playerStatus('Saved to your server.');
    } catch (error) { note('save', error.message); playerStatus('Could not save to the server; will retry.'); }
  }
  var wakeLock = null;
  async function keepAwake() {
    try { if (navigator.wakeLock && emulator && document.visibilityState === 'visible') wakeLock = await navigator.wakeLock.request('screen'); }
    catch (error) { note('wake lock', error.message); }
  }
  // Nostalgist only knows the save folder of cores in its own list. For others, RetroArch saves under the core's
  // display name, so the battery save is placed and read there directly.
  var SAVE_FOLDERS = { clownmdemu: 'ClownMDEmu' }, SAVES = '/home/web_user/retroarch/userdata/saves/';
  // Cores without battery saves; asking them for one would wait for a file that never appears.
  var NO_SAVES = { nova64: true };
  function savePath(game) { return SAVES + SAVE_FOLDERS[web.Cores[game.Platform]] + '/' + game.Id + '.srm'; }
  async function readSave(game) {
    if (NO_SAVES[web.Cores[game.Platform]]) return new Uint8Array(0);
    if (!SAVE_FOLDERS[web.Cores[game.Platform]]) return new Uint8Array(await (await emulator.saveSRAM()).arrayBuffer());
    var fs = emulator.getEmscriptenFS(), path = savePath(game), last = -1;
    try { fs.unlink(path); } catch (_) {}
    emulator.getEmscriptenModule()._cmd_savefiles();
    for (var i = 0; i < 50; i++) {
      await new Promise(function (r) { setTimeout(r, 100); });
      var size = -1; try { size = fs.stat(path).size; } catch (_) {}
      if (size > 0 && size === last) return fs.readFile(path);
      last = size;
    }
    throw new Error('the emulator did not write its save');
  }
  async function playInBrowser(game, fromLink) {
    if (!$('player').hidden) return;
    opener = document.activeElement;
    $('browse').inert = true;
    window.__browserPlay = { booted: false };
    var request = new AbortController();
    launchRequest = request;
    var canvas = document.createElement('canvas'); canvas.tabIndex = 0;
    // Nostalgist assigns its own canvas id. Each launch gets a new surface inside the player.
    $('screen').replaceChildren(canvas);
    $('playing-title').textContent = game.Title;
    $('exit').textContent = 'Back to library';
    showButtons(game.Platform);
    $('player').hidden = false; playerStatus('Loading ' + game.Title + '…');
    $('exit').focus();
    try {
      await loadNostalgist();
      var name = game.Id + '.srm', sram, revision = 0;
      var core = web.Cores[game.Platform], route = 'Games/' + encodeURIComponent(game.Id);
      var options = { headers: { Authorization: header() }, signal: request.signal };
      var content = await fetch(route + '/Content', options);
      if (!content.ok) throw new Error('game unavailable');
      var list = NO_SAVES[core] ? null : await fetch(route + '/Saves', options);
      var server = list && list.ok ? (await list.json()).filter(function (s) { return s.Name === name; })[0] : null;
      if (server) {
        var download = await fetch(route + '/Saves/' + encodeURIComponent(name), options);
        if (download.ok) { sram = await download.blob(); revision = server.Revision; }
      }
      var sramBytes = sram ? new Uint8Array(await sram.arrayBuffer()) : null;
      var rom = await content.blob();
      if (request.signal.aborted) return;
      var instance = await Nostalgist.launch({
        element: canvas, signal: request.signal, respondToGlobalEvents: false,
        retroarchConfig: core === 'nova64' ? {
          input_player1_up: 'up', input_player1_down: 'down', input_player1_left: 'left', input_player1_right: 'right',
          input_player1_b: 'z', input_player1_a: 'x', input_player1_start: 'enter', input_player1_select: 'rshift'
        } : undefined,
        core: { name: core, js: new URL('Web/' + core + '_libretro.js', location.href).href, wasm: new URL('Web/' + core + '_libretro.wasm', location.href).href },
        rom: { fileName: game.Id + game.Extension, fileContent: rom },
        sram: SAVE_FOLDERS[core] ? undefined : sram,
        beforeLaunch: SAVE_FOLDERS[core] && sramBytes ? function (n) {
          var fs = n.getEmscriptenFS(), path = savePath(game);
          fs.mkdirTree(path.slice(0, path.lastIndexOf('/')));
          fs.writeFile(path, sramBytes);
        } : undefined,
      });
      if (request.signal.aborted) return;
      emulator = instance; canvas.focus();
      $('exit').textContent = NO_SAVES[core] ? 'Back to library' : 'Save and exit';
      playing = { game: game, name: name, revision: revision, last: sramBytes, timer: NO_SAVES[core] ? null : setInterval(function () { flush(false); }, 20000) };
      window.__browserPlay = { booted: true, revision: revision };
      diag.browser = game.Title + ' on ' + core + ' · booted · server save revision ' + revision;
      playerStatus((NO_SAVES[core] ? 'Playing · Use the arrow keys, Z and X, or the on-screen controls.' : server ? 'Continuing your save (revision ' + revision + ').' : 'Playing. Saves go to your server.') +
        // Opening from a link is not a tap, so iOS keeps audio off until the first touch.
        (fromLink && ios ? ' Tap the screen once to turn on sound.' : ''));
      keepAwake();
    } catch (error) {
      if (request.signal.aborted) return;
      window.__browserPlay = { error: error.message };
      note('browser play', game.Title + ': ' + error.message);
      diag.browser = game.Title + ' failed to start: ' + error.message;
      playerStatus('Could not start in the browser: ' + error.message + '.');
    }
  }
  async function exitPlayer() {
    var sync = playing && !NO_SAVES[web.Cores[playing.game.Platform]];
    if (sync) { clearInterval(playing.timer); await flush(false); }
    if (launchRequest) { launchRequest.abort(); launchRequest = null; }
    $('screen').replaceChildren();
    if (wakeLock) { wakeLock.release().catch(function () {}); wakeLock = null; }
    if (document.fullscreenElement) document.exitFullscreen().catch(function () {});
    emulator = null; playing = null; $('player').hidden = true; $('browse').inert = false;
    if (sync) {
      try { saved = await api('GET', 'Saves'); } catch (_) {}
      if (!$('player').hidden) return;
      render();
    }
    var trigger = Array.from($('games').querySelectorAll('button')).find(function (b) { return opener && b.getAttribute('aria-label') === opener.getAttribute('aria-label'); });
    (trigger || $('search')).focus();
  }
  $('exit').addEventListener('click', async function () { this.disabled = true; playerStatus('Saving…'); try { await exitPlayer(); } finally { this.disabled = false; } });
  // iPhone Safari has no element fullscreen; show the button only where it works.
  if (document.documentElement.requestFullscreen) {
    $('fullscreen').hidden = false;
    $('fullscreen').addEventListener('click', function () {
      if (document.fullscreenElement) document.exitFullscreen(); else $('player').requestFullscreen().catch(function (e) { note('fullscreen', e.message); });
    });
  }
  window.addEventListener('gamepadconnected', function (e) { if (emulator) playerStatus('Controller connected: ' + e.gamepad.id.slice(0, 40)); note('gamepad', 'connected ' + e.gamepad.id.slice(0, 60)); });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') keepAwake(); });
  // iOS suspends hidden tabs: save whenever the page is hidden.
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flush(true); });
  window.addEventListener('pagehide', function () { flush(true); });
  function showButtons(platform) {
    var box = $('actions'), face = FACE[platform] || [['b', 'B'], ['a', 'A']], columns = face.length === 3 ? 3 : 2;
    box.replaceChildren(); box.style.setProperty('--columns', columns);
    if (SHOULDERS[platform]) [['l', 'L'], ['r', 'R']].forEach(function (x, i) { box.append(pad(x, 'shoulder')); if (columns === 3 && i === 0) box.append(document.createElement('span')); });
    face.forEach(function (x) { box.append(pad(x, 'round')); });
  }
  function pad(x, kind) {
    var button = document.createElement('button');
    button.className = kind; button.setAttribute('data-button', x[0]); button.textContent = x[1]; button.setAttribute('aria-label', x[1]);
    bind(button); return button;
  }
  document.querySelectorAll('#player [data-button]').forEach(bind);
  function bind(button) {
    var name = button.getAttribute('data-button');
    function down(event) { event.preventDefault(); button.classList.add('down'); if (emulator) emulator.pressDown(name); }
    function up(event) { event.preventDefault(); button.classList.remove('down'); if (emulator) emulator.pressUp(name); }
    button.addEventListener('pointerdown', down);
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (type) { button.addEventListener(type, up); });
  }

  async function start() {
    auth = session();
    if (!auth) { setup(['Sign in from Jellyfin home with Remember me selected, then open Retro Games from the menu.']); return; }
    try {
      try { diag.version = (await api('GET', 'Info')).Version; } catch (_) {}
      try { devices = await api('GET', 'Devices'); } catch (error) { note('devices', error.message); }
      $('device').closest('label').hidden = !devices.length;
      // Listening devices first: they work from any browser.
      devices.sort(function (a, b) { return b.Listening - a.Listening; }).forEach(function (d) {
        var o = document.createElement('option'); o.value = d.Id; o.textContent = d.Name + (d.Listening ? ' (ready)' : ''); $('device').append(o);
      });
      games = await api('GET', 'Games');
      Array.from(new Set(games.map(function (g) { return g.Platform; }))).sort().forEach(function (id) {
        var option = document.createElement('option'); option.value = id; option.textContent = PLATFORMS[id] || id; $('platform').append(option);
      });
      // Save status and browser play are optional; older servers or errors just hide them.
      try { saved = await api('GET', 'Saves'); } catch (_) { saved = {}; }
      try { web = await api('GET', 'Web/Config'); } catch (_) {}
      $('third-party').hidden = !web.Enabled;
      $('library').hidden = false; render();
      // #play=<game id> opens a game directly in the browser (shareable link).
      var direct = /^#play=([a-z0-9]+-[0-9a-f]{64})$/.exec(location.hash);
      var target = direct && games.filter(function (g) { return g.Id === direct[1]; })[0];
      if (target && inBrowser(target)) playInBrowser(target, true);
    } catch (error) {
      setup([error.status === 403 ? 'Your account does not have access to RetroBridge. Ask an administrator.' : error.status === 401 ? 'Your Jellyfin session expired. Sign in again, then reload.' : 'RetroBridge is unavailable right now.']);
    }
  }
  function report() {
    var device = devices.filter(function (d) { return d.Id === ($('device') && $('device').value); })[0];
    return [
      'RetroBridge plugin ' + (diag.version || 'unknown') + ' · ' + new Date().toISOString(),
      'Browser: ' + navigator.userAgent,
      'Platform: ' + (ios ? 'iOS' : android ? 'Android' : 'desktop') + ' · secure context: ' + window.isSecureContext + ' · touch points: ' + navigator.maxTouchPoints,
      'Games visible: ' + games.length + ' · with art: ' + games.filter(function (g) { return g.HasArt; }).length,
      'Paired devices: ' + devices.length + (devices.length ? ' (' + devices.map(function (d) { return d.Name + (d.Listening ? ' listening' : ''); }).join(', ') + ')' : ''),
      'Selected device: ' + (device ? device.Name : 'none'),
      'In-browser play: ' + (web.Enabled ? 'on for ' + web.Platforms.join('/') : 'off') + ' · WebAssembly: ' + (typeof WebAssembly === 'object') + ' · WebGL2: ' + !!document.createElement('canvas').getContext('webgl2'),
      'Last launch: ' + (diag.lastLaunch || 'none'),
      'Browser play: ' + (diag.browser || 'not started') + ' · wake lock: ' + ('wakeLock' in navigator) + ' · gamepads: ' + (navigator.getGamepads ? Array.from(navigator.getGamepads()).filter(Boolean).length : 'n/a'),
      'Recent problems:' + (diag.errors.length ? '\n  ' + diag.errors.join('\n  ') : ' none'),
    ].join('\n');
  }
  $('diagnostics').addEventListener('toggle', function () { if (this.open) $('report').textContent = report(); });
  $('copy-report').addEventListener('click', async function () {
    var text = report(); $('report').textContent = text;
    try { await navigator.clipboard.writeText(text); this.textContent = 'Copied'; }
    catch (_) {
      // Clipboard API needs HTTPS; fall back to selecting the text for a manual copy.
      var range = document.createRange(); range.selectNodeContents($('report'));
      var selection = getSelection(); selection.removeAllRanges(); selection.addRange(range);
      try { document.execCommand('copy'); this.textContent = 'Copied'; } catch (_) { this.textContent = 'Select and copy the text below'; }
    }
    var button = this; setTimeout(function () { button.textContent = 'Copy report'; }, 3000);
  });
  $('search').addEventListener('input', render);
  $('platform').addEventListener('change', render);
  $('device').addEventListener('change', render);
  start();
}());
</script>
