<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><body style="margin:0;background:#222;color:#eee;font:18px system-ui">
<canvas id="a" width="300" height="150" style="width:100%"></canvas><canvas id="b" width="300" height="150" style="width:100%"></canvas><pre id="o"></pre>
<script>
function test(id, kind, color) {
  var gl = document.getElementById(id).getContext(kind);
  if (!gl) return kind + ': unavailable';
  gl.clearColor(color[0], color[1], color[2], 1); gl.clear(gl.COLOR_BUFFER_BIT);
  var vs = gl.createShader(gl.VERTEX_SHADER); gl.shaderSource(vs, 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'); gl.compileShader(vs);
  var fs = gl.createShader(gl.FRAGMENT_SHADER); gl.shaderSource(fs, 'precision mediump float;void main(){gl_FragColor=vec4(1.,1.,0.,1.);}'); gl.compileShader(fs);
  var pr = gl.createProgram(); gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr);
  return kind + ': ok, renderer ' + (gl.getParameter(gl.RENDERER)) + ', program link ' + gl.getProgramParameter(pr, gl.LINK_STATUS) + ' ' + (gl.getProgramInfoLog(pr) || '');
}
document.getElementById('o').textContent = test('a', 'webgl', [0, 0, 1]) + '\n' + test('b', 'webgl2', [0, 1, 0]);
</script>
