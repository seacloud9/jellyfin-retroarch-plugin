name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --logger trx
      - run: dotnet format --verify-no-changes --no-restore
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Companion process and transport smoke test (Unix)
        if: runner.os != 'Windows'
        run: python scripts/launcher-smoke.py
      - run: python scripts/package-plugin.py
      - name: Per-user link handler registration
        run: python scripts/link-handler-check.py
      - name: Package the self-contained companion
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS) rids="osx-arm64 osx-x64" ;;
            Windows) rids="win-x64" ;;
            *) rids="linux-x64 linux-arm64" ;;
          esac
          for rid in $rids; do python scripts/package-companion.py --rid "$rid"; done
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '22'
      - name: Browser test dependencies
        if: runner.os == 'Linux'
        run: npm ci --prefix tests/browser
      - name: In-browser play files, pins, and CSP on real Jellyfin (Linux)
        if: runner.os == 'Linux'
        run: python scripts/browser-play-smoke.py
      - name: Real Jellyfin and headless RetroArch save test (Linux Docker)
        if: runner.os == 'Linux'
        run: python scripts/jellyfin-smoke.py --native-linux-docker
      - name: Verify the packaged companion without .NET
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS) python scripts/verify-companion-package.py artifacts/companion/RetroBridge-Companion-0.1.0-osx-arm64.tar.gz ;;
            Windows) python scripts/verify-companion-package.py artifacts/companion/RetroBridge-Companion-0.1.0-win-x64.zip ;;
            *) python scripts/verify-companion-package.py artifacts/companion/RetroBridge-Companion-0.1.0-linux-x64.tar.gz --jellyfin-linux-docker ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: retrobridge-companion-${{ runner.os }}
          path: |
            artifacts/companion/*.tar.gz
            artifacts/companion/*.zip
            artifacts/companion/*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: retrobridge-${{ runner.os }}
          path: |
            artifacts/RetroBridge-0.1.0.zip
            artifacts/RetroBridge-0.1.0.zip.sha256
            src/RetroBridge.Launcher/bin/Release/net10.0/
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build, unit test, and lint the Android companion
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: retrobridge-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
